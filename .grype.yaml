# Grype (item 21): image vulnerability gate, used by publish.yml and
# scripts/security-scan.sh with --fail-on critical --only-fixed.
ignore:
  # Firefox 157, bundled by Playwright 1.64.1 for generator scraping. The
  # fixes are in Firefox 159+, which ships in Playwright 1.65.0 (released
  # 2026-11-09); it passes the two-week supply-chain cooldown on 2026-11-23.
  # Only admin-configured sources are scraped, so exposure is low. Remove this
  # entry with that upgrade (tests/test_grype_ignores.py fails after 2026-11-30).
  - package:
      name: firefox
      type: binary
