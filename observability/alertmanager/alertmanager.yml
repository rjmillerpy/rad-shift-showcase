# Where alerts go. Locally: Mailpit, a mail catcher (http://localhost:8025),
# so nothing leaves the machine. At go-live: SNS email from the CloudWatch
# alarm (infra/monitoring.tf), or point this smarthost at a real SMTP relay.
global:
  smtp_smarthost: mailpit:1025
  smtp_from: alerts@radshift.localhost
  # Mailpit speaks plain SMTP on the compose network. A real relay needs TLS.
  smtp_require_tls: false

route:
  receiver: email
  group_by: [alertname]
  # Wait for related alerts before the first email, then batch updates.
  group_wait: 30s
  group_interval: 5m
  # A still-firing alert is re-sent this often.
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: oncall@radshift.localhost
        send_resolved: true
