# Prometheus for the local stack (roadmap item 15), used by compose.observability.yaml.
# At go-live the same questions are answered by CloudWatch: ALB metrics and
# the alarm in infra/monitoring.tf.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The API's own metrics (app/metrics). Reached on the compose network;
  # the proxy and the load balancer never expose /metrics.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:5000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
