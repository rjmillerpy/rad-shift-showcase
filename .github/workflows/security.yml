name: Security

# Item 21: free stand-ins for commercial SAST/SCA, the same script as
# locally (scripts/security-scan.sh): Semgrep on the code, pip-audit on both
# lockfiles. Images are scanned by Grype in publish.yml, before they reach ECR.
#
# Weekly as well as on changes: new CVEs are published against code that
# hasn't changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scan:
    # A Dependabot PR brings in new third-party code; it isn't run on the host.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs: this job runs on your machine.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep + pip-audit
        run: scripts/security-scan.sh
