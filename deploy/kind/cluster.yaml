# The local Kubernetes cluster (roadmap item 30): one kind node, which is a
# Docker container running Kubernetes. Free; nothing leaves this machine.
#
#   scripts/kind_cluster.sh up      # create it and deploy rad-shift
#   scripts/kind_cluster.sh down    # delete it (and everything in it)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rad-shift
nodes:
  - role: control-plane
    # Pinned by digest, as kind's release notes list it for v0.33.0.
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    # The ingress controller listens on node port 30080 (traefik-values.yaml);
    # this publishes it as localhost:8088, on loopback only. 8088, not 80 or
    # 3000/5000/8080: those belong to the Compose stacks, which can run alongside.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8088
        listenAddress: 127.0.0.1
        protocol: TCP
