{{- $c := dict "root" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rad-shift.name" $c }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  {{- /* With the HPA on, it owns the count: a replicas here would reset it on every upgrade or sync. */}}
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rad-shift.selectorLabels" $c | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # a new pod is ready before an old one goes
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "rad-shift.labels" $c | nindent 8 }}
      annotations:
        {{- include "rad-shift.configChecksum" . | nindent 8 }}
    spec:
      securityContext:
        {{- include "rad-shift.podSecurity" (dict "uid" 1000) | nindent 8 }}
      initContainers:
        {{- include "rad-shift.waitForPostgres" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "rad-shift.image" .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          # The image's entrypoint migrates (scripts/prepare_db.py, under an
          # advisory lock, so replicas starting together take turns), then
          # starts uvicorn.
          {{- include "rad-shift.appEnvFrom" . | nindent 10 }}
          {{- if .Values.worker.enabled }}
          env:
            # The worker pod runs the scheduler; one per replica would
            # run every due source once per replica.
            - name: GENERATOR_SCHEDULER_ENABLED
              value: "false"
          {{- end }}
          ports:
            - name: http
              containerPort: 5000
          # Startup covers the migrations: up to 2 minutes before the other
          # probes take over.
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 60
          # Ready = the database answers (GET /health runs SELECT 1). Not
          # ready takes the pod out of the Service; it is not restarted.
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Alive = the process answers. Not the database check: a database
          # outage would otherwise restart every pod at once, and fix nothing.
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # The endpoint list takes a moment to drop a stopping pod; keep
          # serving until it has, so no request lands on a closed port.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            {{- include "rad-shift.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rad-shift.name" $c }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "rad-shift.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: 5000
      targetPort: http
---
# Voluntary disruptions (a node drain, a cluster upgrade) leave one API pod up.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "rad-shift.name" $c }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "rad-shift.selectorLabels" $c | nindent 6 }}
{{- if .Values.backend.autoscaling.enabled }}
---
# CPU against the pods' requests (metrics-server supplies the numbers).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rad-shift.name" $c }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rad-shift.name" $c }}
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # Scale down slowly: a dip between bursts shouldn't drop pods only to add them back.
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
