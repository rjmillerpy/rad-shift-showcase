{{- if .Values.kafka.enabled -}}
{{- $c := dict "root" . "component" "kafka" -}}
{{- $name := include "rad-shift.name" $c -}}
# One broker in KRaft mode (its own controller), configured as in compose.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "rad-shift.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rad-shift.labels" $c | nindent 8 }}
    spec:
      securityContext:
        # The image's appuser.
        {{- include "rad-shift.podSecurity" (dict "uid" 1000) | nindent 8 }}
      # Without this, Kubernetes injects KAFKA_PORT=tcp://... for the Service
      # named kafka, and the image reads every KAFKA_* variable as config.
      enableServiceLinks: false
      containers:
        - name: kafka
          image: {{ include "rad-shift.image" .Values.kafka.image }}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: {{ printf "PLAINTEXT://%s:9092" $name | quote }}}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data}
            - {name: KAFKA_HEAP_OPTS, value: {{ printf "-Xmx%s -Xms%s" .Values.kafka.heap .Values.kafka.heap | quote }}}
            - {name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }}}
          ports:
            - {name: kafka, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          # A TCP check: the shell tools start a JVM each time (seconds of CPU).
          readinessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: kafka}
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            {{- include "rad-shift.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
            - {name: tmp, mountPath: /tmp}
            # The image writes server.properties and its log4j files here at
            # start, and the broker its logs (GC log included) next door.
            - {name: config, mountPath: /opt/kafka/config}
            - {name: logs, mountPath: /opt/kafka/logs}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "rad-shift.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "rad-shift.selectorLabels" $c | nindent 4 }}
  ports:
    - {name: kafka, port: 9092, targetPort: kafka}
{{- end }}
