---
- name: Install the base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600  # refresh at most hourly: a rerun doesn't count as a change

- name: Create the deploy user (runs the app; no sudo)
  ansible.builtin.user:
    name: "{{ base_deploy_user }}"
    shell: /bin/bash
    create_home: true

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      # Managed by Ansible (ansible/roles/base).
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
    owner: root
    group: root
    mode: "0644"
    # A broken sshd config would lock us out: check it before it's used.
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
