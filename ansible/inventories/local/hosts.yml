# The local target: a container standing in for a server (target/, test.sh).
# A real inventory lists VPS addresses here; nothing else changes.
all:
  children:
    app_servers:
      hosts:
        app1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: .secrets/ansible-key
