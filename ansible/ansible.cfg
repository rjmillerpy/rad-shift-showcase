[defaults]
inventory = inventories/local/hosts.yml
roles_path = roles
collections_path = collections
# Host keys are checked: test.sh records the target's key on first use,
# and a different key afterwards fails the run.
host_key_checking = True
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
forks = 5

[ssh_connection]
ssh_args = -o UserKnownHostsFile=.secrets/known_hosts -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
